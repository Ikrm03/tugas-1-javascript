<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 1 - JavaScript</title>
</head>
<body>
    <script>

        // Menghitung luas persegi panjang
        // Rumus: panjang × lebar
        let panjang = 10;
        let lebar = 5;
        let luasPersegiPanjang = panjang * lebar;

        document.write("<h3>Luas Persegi Panjang</h3>");
        document.write("Panjang = " + panjang + "<br>");
        document.write("Lebar = " + lebar + "<br>");
        document.write("Luas = " + luasPersegiPanjang + "<br><br>");


        // Menghitung luas bujur sangkar
        // Rumus: sisi × sisi
        let sisi = 8;
        let luasBujurSangkar = sisi * sisi;

        document.write("<h3>Luas Bujur Sangkar</h3>");
        document.write("Sisi = " + sisi + "<br>");
        document.write("Luas = " + luasBujurSangkar + "<br><br>");


        // Menghitung luas segitiga
        // Rumus: 1/2 × alas × tinggi
        let alas = 8;
        let tinggi = 6;
        let luasSegitiga = 0.5 * alas * tinggi;

        document.write("<h3>Luas Segitiga</h3>");
        document.write("Alas = " + alas + "<br>");
        document.write("Tinggi = " + tinggi + "<br>");
        document.write("Luas = " + luasSegitiga + "<br>");
    </script>
    
</body>
</html>
